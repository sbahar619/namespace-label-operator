name: Test

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual triggering

env:
  GO_VERSION: '1.21'
  GOLANGCI_LINT_VERSION: 'v1.57.2'

jobs:
  # Setup dependencies and cache for other jobs
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    outputs:
      go-cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # We'll handle caching manually for better control

    - name: Generate cache key
      id: cache-key
      run: |
        echo "key=${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'Makefile') }}" >> $GITHUB_OUTPUT

    - name: Cache Go modules and tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ./bin/
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

  # Fast build verification 
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ./bin/
        key: ${{ needs.dependencies.outputs.go-cache-key }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
          ${{ runner.os }}-go-

    - name: Quick build check
      run: go build -v ./...

  # Parallel jobs that run after dependencies are ready
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ./bin/
        key: ${{ needs.dependencies.outputs.go-cache-key }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
          ${{ runner.os }}-go-

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}
        args: --timeout=5m

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ./bin/
        key: ${{ needs.dependencies.outputs.go-cache-key }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
          ${{ runner.os }}-go-

    - name: Install test dependencies
      run: make envtest ginkgo

    - name: Run unit tests with coverage
      run: |
        make test
        go tool cover -html=cover.out -o coverage.html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./cover.out
        flags: unittests
        name: codecov-umbrella

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html
        retention-days: 30

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=cover.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: ${COVERAGE}%"
        if (( $(echo "${COVERAGE} < 80" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE}% is below threshold of 80%"
          exit 1
        fi
        echo "✅ Coverage ${COVERAGE}% meets threshold"

  # Summary job that depends on all test jobs
  test-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: 
      - dependencies
      - build-check
      - code-quality
      - unit-tests
    if: always()
    steps:
    - name: Check all jobs status
      run: |
        echo "Test Job Results:"
        echo "- Dependencies: ${{ needs.dependencies.result }}"
        echo "- Build Check: ${{ needs.build-check.result }}"
        echo "- Code Quality: ${{ needs.code-quality.result }}"
        echo "- Unit Tests: ${{ needs.unit-tests.result }}"
        
        # Check if any required jobs failed
        if [ "${{ needs.dependencies.result }}" != "success" ] || \
           [ "${{ needs.build-check.result }}" != "success" ] || \
           [ "${{ needs.code-quality.result }}" != "success" ] || \
           [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ One or more test jobs failed"
          exit 1
        fi
        
        echo "✅ All test jobs completed successfully!"
