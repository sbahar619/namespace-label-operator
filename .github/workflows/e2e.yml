name: E2E Tests

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main, develop]  # Only run E2E for main/develop branches
  push:
    branches: [main, develop]  # Direct pushes to main/develop (no PR)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM

env:
  GO_VERSION: '1.21'

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded or this is a manual/scheduled run
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Create kind cluster
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: namespacelabel-e2e
        kubectl_version: v1.28.0

    - name: Install test dependencies
      run: make ginkgo

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Try to download artifacts from CI workflow first, fallback to building
    - name: Download controller image artifact
      id: download-controller
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: controller-image
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Download webhook image artifact  
      id: download-webhook
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: webhook-image
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    # Load artifacts if downloaded successfully
    - name: Load controller image from artifact
      if: steps.download-controller.outcome == 'success'
      run: |
        docker load < controller-image.tar.gz
        docker tag controller:${{ github.sha }} controller:latest

    - name: Load webhook image from artifact
      if: steps.download-webhook.outcome == 'success'
      run: |
        docker load < webhook-image.tar.gz  
        docker tag webhook:${{ github.sha }} webhook:latest

    # Fallback: build images if artifacts not available (manual/scheduled runs)
    - name: Build controller image (fallback)
      if: steps.download-controller.outcome != 'success'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./cmd/controller/Dockerfile
        tags: controller:latest
        load: true
        cache-from: type=gha,scope=controller
        platforms: linux/amd64

    - name: Build webhook image (fallback)
      if: steps.download-webhook.outcome != 'success'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./cmd/webhook/Dockerfile
        tags: webhook:latest
        load: true
        cache-from: type=gha,scope=webhook
        platforms: linux/amd64

    - name: Load images to kind
      run: |
        echo "Checking built images in runner..."
        docker images | grep -E "(controller|webhook)"
        
        echo "Loading controller image to kind cluster..."
        kind load docker-image controller:latest --name namespacelabel-e2e || { 
          echo "Failed to load controller image"; 
          docker images; 
          exit 1; 
        }
        
        echo "Loading webhook image to kind cluster..."
        kind load docker-image webhook:latest --name namespacelabel-e2e || { 
          echo "Failed to load webhook image"; 
          docker images; 
          exit 1; 
        }
        
        echo "Verifying images are loaded in kind cluster..."
        docker exec namespacelabel-e2e-control-plane crictl images | grep -E "(controller|webhook)" || {
          echo "Images not found in kind cluster!";
          docker exec namespacelabel-e2e-control-plane crictl images;
          exit 1;
        }

    - name: Deploy to cluster
      run: |
        # Deploy controller and webhook with correct image references
        make deploy CONTROLLER_IMG=controller:latest WEBHOOK_IMG=webhook:latest

        # Wait a moment for deployment to be created
        sleep 5

        # Patch controller deployment for local images - patch both manager and kube-rbac-proxy containers
        kubectl patch deployment namespacelabel-controller-manager -n namespacelabel-system --type=json --patch '[
          {
            "op": "replace",
            "path": "/spec/template/spec/containers/1/imagePullPolicy",
            "value": "IfNotPresent"
          }
        ]'

        # Patch webhook deployment for local images
        kubectl patch deployment namespacelabel-webhook-server -n namespacelabel-system --type=json --patch '[
          {
            "op": "replace",
            "path": "/spec/template/spec/containers/0/imagePullPolicy",
            "value": "IfNotPresent"
          }
        ]'
        
        # Show deployment status before waiting
        echo "Deployment status:"
        kubectl get deployments -n namespacelabel-system
        kubectl describe deployment namespacelabel-controller-manager -n namespacelabel-system
        
        # Wait for deployments to be ready with longer timeout
        echo "Waiting for controller manager to be ready..."
        kubectl wait --for=condition=Available deployment/namespacelabel-controller-manager -n namespacelabel-system --timeout=600s
        
        echo "Waiting for webhook server to be ready..."
        kubectl wait --for=condition=Available deployment/namespacelabel-webhook-server -n namespacelabel-system --timeout=300s
        
        # Final verification
        kubectl get pods -n namespacelabel-system -o wide

    - name: Run E2E tests
      run: make test-e2e
      timeout-minutes: 20

    - name: Get pod logs on failure
      if: failure()
      run: |
        echo "=== Debug Information ==="
        echo "Docker images in runner:"
        docker images | grep -E "(controller|webhook)" || true
        
        echo "Images in kind cluster:"
        docker exec namespacelabel-e2e-control-plane crictl images | grep -E "(controller|webhook)" || true
        
        echo "=== Controller logs ==="
        kubectl logs deployment/namespacelabel-controller-manager -n namespacelabel-system --all-containers=true --tail=100 || true
        
        echo "=== Webhook logs ==="
        kubectl logs deployment/namespacelabel-webhook-server -n namespacelabel-system --tail=100 || true
        
        echo "=== Pod status ==="
        kubectl get pods -n namespacelabel-system -o wide || true
        kubectl describe pods -n namespacelabel-system || true
        
        echo "=== Deployment status ==="
        kubectl describe deployment namespacelabel-controller-manager -n namespacelabel-system || true
        kubectl describe deployment namespacelabel-webhook-server -n namespacelabel-system || true

    - name: Cleanup kind cluster
      if: always()
      run: kind delete cluster --name namespacelabel-e2e
