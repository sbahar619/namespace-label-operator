name: CI

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual triggering

env:
  GO_VERSION: '1.21'
  GOLANGCI_LINT_VERSION: 'v1.57.2'

jobs:
  # Fast validation for immediate feedback
  validation:
    name: Validation
    runs-on: ubuntu-latest
    outputs:
      go-cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # We'll handle caching manually for better control

    - name: Generate cache key
      id: cache-key
      run: |
        echo "key=${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'Makefile') }}" >> $GITHUB_OUTPUT

    - name: Cache Go modules and tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ./bin/
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Quick build check
      run: go build -v ./...

    - name: Verify go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "❌ Code is not formatted. Run 'make fmt'"
          gofmt -s -l .
          exit 1
        fi
        echo "✅ Code is properly formatted"

    - name: Run go vet
      run: go vet ./...

  # Parallel jobs that run after validation passes
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: validation
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ./bin/
        key: ${{ needs.validation.outputs.go-cache-key }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}
        args: --timeout=5m

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validation
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ./bin/
        key: ${{ needs.validation.outputs.go-cache-key }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Install test dependencies
      run: make envtest ginkgo

    - name: Run unit tests with coverage
      run: |
        make test
        go tool cover -html=cover.out -o coverage.html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./cover.out
        flags: unittests
        name: codecov-umbrella

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html
        retention-days: 30

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=cover.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: ${COVERAGE}%"
        if (( $(echo "${COVERAGE} < 80" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE}% is below threshold of 80%"
          exit 1
        fi
        echo "✅ Coverage ${COVERAGE}% meets threshold"

  build-controller:
    name: Build Controller
    runs-on: ubuntu-latest
    needs: validation
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build controller Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./cmd/controller/Dockerfile
        tags: controller:${{ github.sha }}
        load: true
        cache-from: type=gha,scope=controller
        cache-to: type=gha,mode=max,scope=controller
        platforms: linux/amd64

    - name: Save controller image
      run: docker save controller:${{ github.sha }} | gzip > controller-image.tar.gz

    - name: Upload controller image artifact
      uses: actions/upload-artifact@v4
      with:
        name: controller-image
        path: controller-image.tar.gz
        retention-days: 1

  build-webhook:
    name: Build Webhook
    runs-on: ubuntu-latest
    needs: validation
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build webhook Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./cmd/webhook/Dockerfile
        tags: webhook:${{ github.sha }}
        load: true
        cache-from: type=gha,scope=webhook
        cache-to: type=gha,mode=max,scope=webhook
        platforms: linux/amd64

    - name: Save webhook image
      run: docker save webhook:${{ github.sha }} | gzip > webhook-image.tar.gz

    - name: Upload webhook image artifact
      uses: actions/upload-artifact@v4
      with:
        name: webhook-image
        path: webhook-image.tar.gz
        retention-days: 1

  # Summary job that depends on all others
  ci-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: 
      - validation
      - code-quality
      - unit-tests
      - build-controller
      - build-webhook
    if: always()
    steps:
    - name: Check all jobs status
      run: |
        echo "CI Job Results:"
        echo "- Validation: ${{ needs.validation.result }}"
        echo "- Code Quality: ${{ needs.code-quality.result }}"
        echo "- Unit Tests: ${{ needs.unit-tests.result }}"
        echo "- Build Controller: ${{ needs.build-controller.result }}"
        echo "- Build Webhook: ${{ needs.build-webhook.result }}"
        
        # Check if any required jobs failed
        if [ "${{ needs.validation.result }}" != "success" ] || \
           [ "${{ needs.code-quality.result }}" != "success" ] || \
           [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.build-controller.result }}" != "success" ] || \
           [ "${{ needs.build-webhook.result }}" != "success" ]; then
          echo "❌ One or more CI jobs failed"
          exit 1
        fi
        
        echo "✅ All CI jobs completed successfully!"