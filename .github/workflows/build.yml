name: Build

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main, develop]  # Only build for main/develop branches
  push:
    branches: [main, develop]  # Direct pushes to main/develop (no PR)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-controller:
    name: Build Controller
    runs-on: ubuntu-latest
    # Only run if Test workflow succeeded or this is a manual/push run
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build controller Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./cmd/controller/Dockerfile
        tags: controller:${{ github.sha }}
        load: true
        cache-from: type=gha,scope=controller
        cache-to: type=gha,mode=max,scope=controller
        platforms: linux/amd64

  build-webhook:
    name: Build Webhook
    runs-on: ubuntu-latest
    # Only run if Test workflow succeeded or this is a manual/push run
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build webhook Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./cmd/webhook/Dockerfile
        tags: webhook:${{ github.sha }}
        load: true
        cache-from: type=gha,scope=webhook
        cache-to: type=gha,mode=max,scope=webhook
        platforms: linux/amd64
